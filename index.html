<script>
(function(){
  var h1=document.querySelector('.hero h1'),h2=document.querySelector('.hero h2');
  function fit(el,frac){
    el.style.fontSize='100px';
    var w=el.getBoundingClientRect().width||1;
    el.style.fontSize=(100*frac*document.documentElement.clientWidth/w)+'px';
  }
  function run(){
    var small=document.documentElement.clientWidth<720;
    fit(h1,small?.92:.747);fit(h2,small?.8:.612);
  }
  run();window.addEventListener('resize',run);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(run);
})();
